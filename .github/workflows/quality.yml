
name: JoshHack Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run JUnit regression tests
        run: ./mvnw test

      - name: Run PIT mutation testing
        if: ${{ success() }}
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joshhack-pit-report
          path: target/pit-reports/

      - name: Run SpotBugs static analysis
        run: ./mvnw spotbugs:spotbugs

      - name: Upload SpotBugs SARIF results
        if: ${{ always() && hashFiles('target/spotbugs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/spotbugs.sarif
          category: spotbugs
